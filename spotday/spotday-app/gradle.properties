## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Increased heap size to prevent OutOfMemoryError during dex merging
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
#Sat May 17 16:39:24 PDT 2025
android.enableJetifier=true
android.useAndroidX=true

# Google Maps API Keys
# NOTE: API keys should be stored in local.properties (which is gitignored)
# This file is tracked by git, so DO NOT put actual API keys here.
# Add your keys to local.properties instead:
# MAPS_API_KEY=your_key_here
# PLACES_API_KEY=your_key_here